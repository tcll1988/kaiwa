<h2 class="page-title" lang="zh-Hans">“吧”の使い方</h2>
<div class="card note">

  <p></p>

<table>
  <tr>
    <td;>　第三課では、推量の意味に使われる“吧”について説明した。この課に出ている“吧”は勧誘や要求、または命令のときに使われるものである。たとえば、  
         <br />
          </td>
  </tr>
      <tr>
    <td><span class="ex-ch" lang="zh-Hans">你六点半来吧。 </span>
                     <span class="ex-py">Nǐ liù diǎn bàn lái ba. </span>                    
                     <span class="ex-jp" lang="ja">六時半に来なさい。 </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">再吃一碗吧。 </span>
        <span class="ex-py">Zài chī yì wǎn ba. </span>
        <span class="ex-jp" lang="ja">もう一杯食べたらどうですか。 </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">现在五点了，快走吧。 </span>
        <span class="ex-py">Xiànzài wǔ diǎn le, kuài zǒu ba. </span>
        <span class="ex-jp" lang="ja">今もう五時なので、急いで歩こう。 </span></td>
  </tr>
