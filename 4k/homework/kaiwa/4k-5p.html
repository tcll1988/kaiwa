<h2 class="page-title" lang="zh-Hans">“呢”の使い方①</h2>
<div class="card note">

  <p></p>

<table>
  <tr>
    <td;>　中国語の“呢”は終助詞であるので、文末に入る。疑問以外の意味にも使われるが、ここでは主として疑問を表わすときの使い方について説明する。たとえば、 
       <br />
          </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">我喜欢她，你呢？ </span>
                              <span class="ex-py">Wǒ xǐhuan tā,nǐ ne？</span>
                              <span class="ex-jp" lang="ja">私は彼女が好きだが、あなたは？</span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">我的词典呢？ </span>
                                     <span class="ex-py">Wǒ de cídiǎn ne？ </span>
                                     <span class="ex-jp" lang="ja">私の辞書は？ </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">她是谁呢？ </span>
        <span class="ex-py">Tā shì shéi ne？ </span>
        <span class="ex-jp" lang="ja">彼女は誰だろうか。 </span></td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">明天去哪儿呢？ </span>
        <span class="ex-py">Míngtiān qù nǎr ne？ </span>
        <span class="ex-jp" lang="ja">明日どこへ行こうか。 </span></td>
  </tr>
