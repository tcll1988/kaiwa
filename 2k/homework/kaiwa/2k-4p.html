<h2 class="page-title" lang="zh-Hans">“几”と“多少”の使い方</h2>
<div class="card note">

  <p></p>

<table>
  <tr>
    <td;>　“几”は普通 10 以下の数を問うときに使われ、それ以上の数を問う場合には“多少”は使われる。いずれも数を聞くための表現である。たとえば、 
       <br />
          </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">今天几号？ </span>
                              <span class="ex-py">Jīntiān jǐ hào？ </span>
                              <span class="ex-jp" lang="ja">今日は何日なの？ </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">今天八号。 </span>
                                     <span class="ex-py">Jīntiān bā hào. </span>
                                     <span class="ex-jp" lang="ja">今日は八日だ。 </span> </td>
  </tr>

  <tr>
    <td><span class="ex-ch" lang="zh-Hans">今天多少号？ </span>
        <span class="ex-py">Jīntiān duōshǎo hào？ </span>
        <span class="ex-jp" lang="ja">今日は何日なの？ </span></td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">今天二十九号。 </span>
        <span class="ex-py">Jīntiān èrshíjiǔ hào. </span>
        <span class="ex-jp" lang="ja">今日は二十九日だ。 </span> </td>
  </tr>
