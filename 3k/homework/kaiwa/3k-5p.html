<h2 class="page-title" lang="zh-Hans">“……吧”の使い方</h2>
<div class="card note">

  <p></p>

<table>
  <tr>
    <td;>　中国語の“吧”は終助詞であり、推量などに使われる。日本語の「～だろう」という意味である。たとえば、 
       <br />
          </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">她是学生吧。 </span>
                              <span class="ex-py">Tā shì xuésheng ba. </span>
                              <span class="ex-jp" lang="ja">彼女は学生だろう。 </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">你是老师吧。 </span>
                                     <span class="ex-py">Nǐ shì lǎoshī ba. </span>
                                     <span class="ex-jp" lang="ja">貴方は先生でしょう。 </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">她大概来吧。 </span>
        <span class="ex-py">Tā dàgài lái ba. </span>
        <span class="ex-jp" lang="ja">彼女は多分来るだろう。 </span></td>
  </tr>
