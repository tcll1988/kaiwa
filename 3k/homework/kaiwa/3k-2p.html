<h2 class="page-title" lang="zh-Hans">“什么”と“谁”の使い方</h2>
<div class="card note">

  <p></p>

<table>
  <tr>
    <td;>　中国語の“什么”と“谁”のいずれも疑問代名詞である。疑問代名詞を用いた疑問文は、文末に疑問を表わす疑問終助詞である“吗”を入れないことに注意すべきである。たとえば､  
  
       <br />
          </td>
  </tr>
  <tr>
    <td>
    <span class="ex-ch" lang="zh-Hans">那是什么？ </span>
    <span class="ex-py">Nà shì shénme？ </span>
    <span class="ex-jp" lang="ja">それは何なの？ </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">她是谁？ </span>
                                     <span class="ex-py">Tā shì shéi？  </span>
                                     <span class="ex-jp" lang="ja">彼女は誰？ </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">那是什么书？ </span>
        <span class="ex-py">Nà shì shénme shū？ </span>
        <span class="ex-jp" lang="ja">それは何の本？ </span></td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">这是谁的书？ </span>
        <span class="ex-py">Zhè shì shéi de shū？  </span>
        <span class="ex-jp" lang="ja">これは誰の本なの？  </span> </td>
  </tr>
  
      

</table>
