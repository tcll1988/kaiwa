<h2 class="page-title" lang="zh-Hans">“什么”と“谁”の使い方</h2>
<div class="card note">

  <p></p>

<table>
  <tr>
    <td;>　中国語の“什么”と“谁”のいずれも疑問代名詞である。疑問代名詞を用いた疑問文は、文末に疑問を表わす疑問終助詞である“吗”を入れないことに注意すべきである。たとえば､  
  
       <br />
          </td>
  </tr>
  <tr>
    <td>
    <span class="ex-ch ruby" lang="zh-Hans"><span class="w"><span class="sy"><span class="py">Nà</span><span class="hz">那</span></span></span><span class="w"><span class="sy"><span class="py">shì</span><span class="hz">是</span></span></span><span class="w"><span class="sy"><span class="py">shén</span><span class="hz">什</span></span><span class="sy"><span class="py">me</span><span class="hz">么</span></span><span class="pu"><span class="py"> </span><span class="hz">？</span></span></span></span>
    <span class="ex-jp" lang="ja">それは何なの？ </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch ruby" lang="zh-Hans"><span class="w"><span class="sy"><span class="py">Tā</span><span class="hz">她</span></span></span><span class="w"><span class="sy"><span class="py">shì</span><span class="hz">是</span></span></span><span class="w"><span class="sy"><span class="py">shéi</span><span class="hz">谁</span></span><span class="pu"><span class="py"> </span><span class="hz">？</span></span></span></span>
                                     <span class="ex-jp" lang="ja">彼女は誰？ </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch ruby" lang="zh-Hans"><span class="w"><span class="sy"><span class="py">Nà</span><span class="hz">那</span></span></span><span class="w"><span class="sy"><span class="py">shì</span><span class="hz">是</span></span></span><span class="w"><span class="sy"><span class="py">shén</span><span class="hz">什</span></span><span class="sy"><span class="py">me</span><span class="hz">么</span></span></span><span class="w"><span class="sy"><span class="py">shū</span><span class="hz">书</span></span><span class="pu"><span class="py"> </span><span class="hz">？</span></span></span></span>
