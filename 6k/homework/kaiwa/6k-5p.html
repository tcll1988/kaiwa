<h2 class="page-title" lang="zh-Hans">“和……一起”の使い方</h2>
<div class="card note">

  <p></p>

<table>
  <tr>
    <td;>　中国語の“和……一起”は日本語の｢～と一緒に｣という意味に相当する。このときの否定表現に注意すべきである。たとえば､  
        <br />
          </td>
  </tr>
  <tr>
    <td><span class="ex-ch ruby" lang="zh-Hans"><span class="w"><span class="sy"><span class="py">Wǒ</span><span class="hz">我</span></span></span><span class="w"><span class="sy"><span class="py">hé</span><span class="hz">和</span></span></span><span class="w"><span class="sy"><span class="py">gē</span><span class="hz">哥</span></span><span class="sy"><span class="py">ge</span><span class="hz">哥</span></span></span><span class="w"><span class="sy"><span class="py">yì</span><span class="hz">一</span></span><span class="sy"><span class="py">qǐ</span><span class="hz">起</span></span></span><span class="w"><span class="sy"><span class="py">kàn</span><span class="hz">看</span></span></span><span class="w"><span class="sy"><span class="py">diàn</span><span class="hz">电</span></span><span class="sy"><span class="py">yǐng</span><span class="hz">影</span></span></span><span class="w"><span class="sy"><span class="py">le</span><span class="hz">了</span></span><span class="pu"><span class="py"> </span><span class="hz">。</span></span></span></span>
                              <span class="ex-jp" lang="ja">私は兄と一緒に映画を見た。 </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch ruby" lang="zh-Hans"><span class="w"><span class="sy"><span class="py">Wǒ</span><span class="hz">我</span></span></span><span class="w"><span class="sy"><span class="py">méi</span><span class="hz">没</span></span></span><span class="w"><span class="sy"><span class="py">hé</span><span class="hz">和</span></span></span><span class="w"><span class="sy"><span class="py">gē</span><span class="hz">哥</span></span><span class="sy"><span class="py">ge</span><span class="hz">哥</span></span></span><span class="w"><span class="sy"><span class="py">yì</span><span class="hz">一</span></span><span class="sy"><span class="py">qǐ</span><span class="hz">起</span></span></span><span class="w"><span class="sy"><span class="py">kàn</span><span class="hz">看</span></span></span><span class="w"><span class="sy"><span class="py">diàn</span><span class="hz">电</span></span><span class="sy"><span class="py">yǐng</span><span class="hz">影</span></span><span class="pu"><span class="py"> </span><span class="hz">。</span></span></span></span>
                                     <span class="ex-jp" lang="ja">私は兄と一緒に映画を見なかった。 </span> </td>
  </tr>

    <td><span class="ex-ch ruby" lang="zh-Hans"><span class="w"><span class="sy"><span class="py">Wǒ</span><span class="hz">我</span></span></span><span class="w"><span class="sy"><span class="py">bù</span><span class="hz">不</span></span></span><span class="w"><span class="sy"><span class="py">hé</span><span class="hz">和</span></span></span><span class="w"><span class="sy"><span class="py">gē</span><span class="hz">哥</span></span><span class="sy"><span class="py">ge</span><span class="hz">哥</span></span></span><span class="w"><span class="sy"><span class="py">yì</span><span class="hz">一</span></span><span class="sy"><span class="py">qǐ</span><span class="hz">起</span></span></span><span class="w"><span class="sy"><span class="py">kàn</span><span class="hz">看</span></span></span><span class="w"><span class="sy"><span class="py">diàn</span><span class="hz">电</span></span><span class="sy"><span class="py">yǐng</span><span class="hz">影</span></span><span class="pu"><span class="py"> </span><span class="hz">。</span></span></span></span>
