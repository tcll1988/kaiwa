<div class="card note">

  <p></p>

<table>

    <td;>　中国語の“去＋動詞”は日本語の「～しに行く」という意味である。もし「～へ～しに行く」という意味であれば、場所を表わす名詞を必ず“去”の後に入れる。たとえば、   
         <br />
          </td>
  </tr>
   <tr>
    <td>
    <span class="ex-ch" lang="zh-Hans">她昨天去打工了。 </span>
    <span class="ex-py">Tā zuótiān qù dǎ gōng le. </span>
    <span class="ex-jp" lang="ja">彼女は昨日バイトに行った。</span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">我去图书馆看书。 </span>
                                     <span class="ex-py">Wǒ qù túshūguǎn kàn shū. </span>
                                     <span class="ex-jp" lang="ja">私は図書館へ本を読みに行く。 </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">明天我们去公园玩儿。 </span>
        <span class="ex-py">Míngtiān wǒmen qù gōngyuán wánr. </span>
        <span class="ex-jp" lang="ja">明日私たちは公園へ遊びに行く。</span></td>
