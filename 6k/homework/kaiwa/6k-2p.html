<h2 class="page-title" lang="zh-Hans">“挺……的”の使い方</h2>
<div class="card note">

  <p></p>

<table>
<tr>
    <td;>　この表現に使われている“挺”は日本語に訳されると、「とても」や「なかなか」という意味である。“挺”を使うときは文末に常に“的”で呼応する。たとえば、 
         <br />
          </td>
  </tr>
    <tr>
    <td>
    <span class="ex-ch" lang="zh-Hans">这本书挺有意思的。 </span>
    <span class="ex-py">Zhè běn shū tǐng yǒuyìsi de. </span>
    <span class="ex-jp" lang="ja">この本はなかなか面白い。 </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">这个公园挺大的。 </span>
                                     <span class="ex-py">Zhè ge gōngyuán tǐng dà de. </span>
                                     <span class="ex-jp" lang="ja">この公園はなかなか広い。  </span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">昨天的天气挺好的。 </span>
        <span class="ex-py">Zuótiān de tiānqì tǐng hǎo de. </span>
        <span class="ex-jp" lang="ja">昨日の天気はとてもすばらしかった。 </span></td>
  </tr>
