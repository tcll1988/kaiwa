<h2 class="page-title" lang="zh-Hans">“ 姓 ”と“叫”の使い方</h2>
<div class="card note">

  <p></p>

<table>
  <tr>
    <td;>　中国語の“姓”も“叫”も、日本語の「～と言う」と訳されるが、苗字を言うときには“姓”を使い、ネームか、フルネームを言うときには“叫”を使う。たとえば、
       <br />
          </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">我姓张。</span>
                              <span class="ex-py"> Wǒ xìng Zhāng. </span>
                              <span class="ex-jp" lang="ja">私は張と言う。</span> </td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">我姓山田。  </span>
                                     <span class="ex-py"> Wǒ xìng Shāntián.  </span>
                                     <span class="ex-jp" lang="ja">私は山田と言う。</span> </td>
  </tr>
  
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">我叫张华。 </span>
        <span class="ex-py"> Wǒ jiào Zhāng Huá.   </span>
        <span class="ex-jp" lang="ja">私は張華と言う。 </span></td>
  </tr>
  <tr>
    <td><span class="ex-ch" lang="zh-Hans">我叫山田爱子。 </span>
        <span class="ex-py"> Wǒ jiào Shāntián Àizǐ.   </span>
        <span class="ex-jp" lang="ja">私は山田愛子と言う。</span> </td>
  </tr>
