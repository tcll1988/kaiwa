    <td>　中国語の“请……”は、日本語の「どうぞ～してください」という意味であり、ここの“请”は文頭に入る。たとえば、
 </td>

    <span class="ex-py">Qǐngzuò.</span>

</td>
  </tr>

    <span class="ex-py">Qǐng duō guānzhào.</span>

</td>
